# =============================================================================
#  Nivel 03 · Bloque 3 — Deployment + Service (LoadBalancer)
#  Despliega la imagen de Artifact Registry y expone la app con un LB de GCP
#  aprovisionado automaticamente por Kubernetes.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  labels:
    app: web-app
spec:
  replicas: 2                       # dos pods: para VER el balanceo (como el MIG)
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: web-app
          image: us-central1-docker.pkg.dev/juan-devops-lab-dev/lab-images/web-app:v1
          ports:
            - containerPort: 80
          # Downward API: la identidad del pod la inyecta la plataforma,
          # el contenedor NO la adivina (resuelve la leccion del Nivel 01).
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # En Autopilot PAGAS lo que pides: requests ajustados = costo controlado.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          # Readiness: el Service no enruta hasta que el pod responde 200 en /.
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 10
          # Liveness: reinicia un pod vivo pero con la app colgada (autohealing).
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
spec:
  type: LoadBalancer               # <- GKE aprovisiona un LB de GCP automaticamente
  selector:
    app: web-app                   # enruta a los pods con este label
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
